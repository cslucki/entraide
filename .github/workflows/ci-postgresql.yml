name: PostgreSQL CI

# Automatique vers `main` seulement ; manuel partout ailleurs (TASK-1148).
#
# Chaque poussee sur une PR `develop` declenchait les deux suites completes —
# une vingtaine de minutes pour PostgreSQL — y compris sur des commits
# intermediaires que personne n'allait merger. Les gates sont desormais
# demandes UNE FOIS, volontairement, sur le HEAD final :
#
#     ai/scripts/run-full-ci.sh --wait
#
# Un commit ajoute ensuite change le HEAD et invalide la preuve : il faut
# relancer. C'est exactement ce que verifie `merge-task.sh`, qui exige les deux
# gates verts sur le SHA EXACT du commit a merger.
#
# Les PR de release vers `main` gardent la securite automatique complete.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Une nouvelle poussee sur la meme branche annule la precedente : le job dure
# desormais une vingtaine de minutes, et les empiler ne renseigne personne.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate (blocking)
    runs-on: ubuntu-latest

    # Le job est passe de ~70 s a ~20 min en gagnant la suite Feature. Sans
    # cette borne, le defaut de GitHub est 360 minutes : un test qui pend
    # retiendrait un runner six heures.
    timeout-minutes: 45

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: bouclepro_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      APP_ENV: testing
      APP_KEY: base64:b+IwxNpzaahGTvmk+0WLnzODWBnKA99oQDutpRQ7xfI=
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bouclepro_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci --prefer-offline

      - name: Build frontend assets
        run: npm run build

      - name: Clear Laravel caches
        run: php artisan config:clear && php artisan view:clear

      - name: Run migrations
        run: php artisan migrate --force

      # Les deux moities du gate, dans **un seul job** : l'installation de
      # composer, npm et la construction des assets coutent environ une minute,
      # et les dedoubler en deux jobs paierait cette minute deux fois pour rien.
      # Les etapes restent separees pour que leurs durees se lisent
      # independamment.
      - name: Run Unit tests (blocking)
        run: php vendor/bin/phpunit --configuration phpunit.ci-minimal.xml

      # Avant TASK-1112, la CI ne lançait **que** les tests Unit : aucune
      # regression Feature ne pouvait rendre ce gate rouge. La liste des classes
      # exclues est dans `phpunit.ci-feature.xml`, avec la raison de chacune —
      # elle doit retrecir, jamais grandir.
      - name: Run Feature tests (blocking)
        run: php vendor/bin/phpunit --configuration phpunit.ci-feature.xml
