name: PostgreSQL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Une nouvelle poussee sur la meme branche annule la precedente : le job dure
# desormais une vingtaine de minutes, et les empiler ne renseigne personne.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate (blocking)
    runs-on: ubuntu-latest

    # Le job est passe de ~70 s a ~20 min en gagnant la suite Feature. Sans
    # cette borne, le defaut de GitHub est 360 minutes : un test qui pend
    # retiendrait un runner six heures.
    timeout-minutes: 45

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: bouclepro_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      APP_ENV: testing
      APP_KEY: base64:b+IwxNpzaahGTvmk+0WLnzODWBnKA99oQDutpRQ7xfI=
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bouclepro_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      # TASK-1150 : le job tourne TOUJOURS (jamais de `if:` au niveau job) —
      # seule la charge interne varie, via un label `validation:<level>` pose
      # sur la PR. Hors `pull_request` (push develop/main, workflow_dispatch),
      # ou si aucun label reconnu n'est present, la charge reste `full` :
      # le doute se resout vers plus de tests, jamais moins.
      - name: Determine validation level
        id: level
        run: |
          MODE="full"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
            if echo "$LABELS" | grep -qE '"validation:(micro-ux|no-app-ci)"'; then
              MODE="light"
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved CI mode: $MODE (event=${{ github.event_name }})"

      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      # Frontend build seulement en mode full : la suite Unit (mode light)
      # ne rend pas de vue @vite.
      - name: Setup Node.js
        if: steps.level.outputs.mode == 'full'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        if: steps.level.outputs.mode == 'full'
        run: npm ci --prefer-offline

      - name: Build frontend assets
        if: steps.level.outputs.mode == 'full'
        run: npm run build

      - name: Clear Laravel caches
        run: php artisan config:clear && php artisan view:clear

      - name: Run migrations
        run: php artisan migrate --force

      # Les deux moities du gate, dans **un seul job** : l'installation de
      # composer, npm et la construction des assets coutent environ une minute,
      # et les dedoubler en deux jobs paierait cette minute deux fois pour rien.
      # Les etapes restent separees pour que leurs durees se lisent
      # independamment. Unit tourne dans les DEUX modes : c'est la validation
      # du mode light (MICRO_UX / NO_APP_CI).
      - name: Run Unit tests (blocking)
        run: php vendor/bin/phpunit --configuration phpunit.ci-minimal.xml

      # Avant TASK-1112, la CI ne lançait **que** les tests Unit : aucune
      # regression Feature ne pouvait rendre ce gate rouge. La liste des classes
      # exclues est dans `phpunit.ci-feature.xml`, avec la raison de chacune —
      # elle doit retrecir, jamais grandir. Mode full uniquement : STANDARD et
      # SENSITIVE gardent la couverture complete ; MICRO_UX/NO_APP_CI se
      # contentent d'Unit.
      - name: Run Feature tests (blocking)
        if: steps.level.outputs.mode == 'full'
        run: php vendor/bin/phpunit --configuration phpunit.ci-feature.xml
